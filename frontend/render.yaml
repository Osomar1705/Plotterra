# Frontend como sitio estatico en Render (gratis y funciona con repos privados).
# Alternativa: Vercel, con vercel.json. En los dos hay que poner VITE_API_BASE_URL.
services:
  - type: web
    name: fieldshift-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # /opciones y /plan son rutas de la app, no archivos: todo va a index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # URL publica del backend en Render, terminada en /api/v1. Ajustarla si
      # Render le asigna otro subdominio.
      - key: VITE_API_BASE_URL
        value: https://fieldshift-backend.onrender.com/api/v1
      - key: VITE_USE_LOCAL_MOCKS
        value: "false"
